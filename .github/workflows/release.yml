name: Check And Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - uses: msys2/setup-msys2@v2.33.0
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-ffmpeg
      - name: Locate FFmpeg Runtime
        shell: msys2 {0}
        run: printf 'FFMPEG_BIN=%s\n' "$(cygpath -w /ucrt64/bin)" >> "$(cygpath -u "$GITHUB_ENV")"
      - run: npm ci
      - name: Restore Runtime Dependencies
        shell: pwsh
        run: ./tools/bootstrap-runtime.ps1 -FfmpegBin $env:FFMPEG_BIN
      - name: Compile Native Services
        shell: pwsh
        run: |
          ./tools/native-capture/build.ps1
          ./tools/build-updater.ps1
      - name: Verify Source And Interfaces
        shell: pwsh
        run: |
          node tools/build-ui.js
          npm test
      # Branch pushes/manual checks never make a distributable or publish assets.
      # A matching explicit version tag is the deliberate release trigger.
      - name: Validate Release Version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: node -e "const p=require('./package.json');if('v'+p.version!==process.env.GITHUB_REF_NAME)throw Error('Tag and package version must match');"
      - name: Package Tagged Version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          ./tools/package.ps1
          $version=(Get-Content package.json -Raw | ConvertFrom-Json).version
          Compress-Archive -LiteralPath dist/Klip-win32-x64 -DestinationPath "dist/Klip-v$version-win32-x64.zip"
          node tools/sign-release.js --archive "dist/Klip-v$version-win32-x64.zip" --version $version
        env:
          KLIP_SIGNING_PRIVATE_KEY: ${{ secrets.KLIP_SIGNING_PRIVATE_KEY }}
      - name: Publish Private Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version=(Get-Content package.json -Raw | ConvertFrom-Json).version
          ./tools/github/gh.exe release create $env:GITHUB_REF_NAME "dist/Klip-v$version-win32-x64.zip" dist/klip-update.json dist/klip-update.sig --repo $env:GITHUB_REPOSITORY --verify-tag --title "Klip $version" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
